# Binaries and the container image, both with the flags build.sh uses, so a
# build here matches a local one byte for byte.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Nothing here needs more than reading the tree; the two jobs that do add a
# permission below, and nothing but the tag job can write to a release.
permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # The container image is published under this version on every run that
  # pushes. Bump it when the image changes in a way a puller should see.
  RELEASE_TAG: "0.0.1"

jobs:
  # The line gate that used to sit here counted discards on the net line count
  # of client/, so it failed on every change that added a line and passed on any
  # change that deleted live code to pay for it. Size is not a defect: the checks
  # below fail on a defect instead, and a guest reading the tree gets a type
  # check that actually checks, a formatter, a linter, and a doc that matches the
  # file it describes.

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: install
        run: npm ci --prefix client
      # A type error that builds is still a broken client: esbuild strips types
      # without reading them. The check script is the tree's own, so a tsconfig
      # change reaches this job.
      - name: type check
        run: npm --prefix client run check
      - name: lint
        run: npm --prefix client run lint
      # Formatting and the README line table are real checks too, but the tree is
      # not clean for either today (18 files, and the counts drifted), so they
      # come in a tree-wide change of their own rather than mixed into this one.
      - name: audit
        run: npm --prefix client audit --omit=dev --audit-level=high

  gochecks:
    name: go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A tree formatted two ways hides real diffs. This is the one check that
      # costs nothing and that every contributor can run offline.
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$out" ]; then
            echo "these files are not gofmt clean:" >&2
            echo "$out" >&2
            exit 1
          fi

  binaries:
    name: stanze ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            arch: amd64
            goamd64: v1
          - label: linux-amd64-v4
            arch: amd64
            goamd64: v4
          - label: linux-arm64
            arch: arm64
            goamd64: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The filter module is built on the runner, the same way build.sh does
      # it: the packer refuses to pack a tree without static/fe.wasm. The sdk
      # is the pinned release, verified by its checksum before it is unpacked.
      - name: filter
        env:
          WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          sdk=/opt/wasi-sdk
          if [ ! -x "$sdk/bin/clang" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 900 -o /tmp/sdk.tar.gz "$WASI_SDK_URL"
            echo "$WASI_SDK_SHA256  /tmp/sdk.tar.gz" | sha256sum -c -
            sudo mkdir -p "$sdk"
            sudo tar -xzf /tmp/sdk.tar.gz -C "$sdk" --strip-components=1
            rm -f /tmp/sdk.tar.gz
          fi
          TIER=small CC="$sdk/bin/clang" tools/fewasm/build.sh tools/fewasm/out
          cp tools/fewasm/out/fe.wasm static/fe.wasm
          cp tools/fewasm/engine/weights/fe.q8 static/fe.q8
          rm -rf tools/fewasm/out
          test -s static/fe.wasm

      # The client is TypeScript and its bundle is not in the tree, so both are
      # rebuilt from this commit's source first, exactly like build.sh does
      # (bundle, wasm, then the deterministic pack).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The filter is checked before it is packed: the worklet's own loader
      # runs over the two files the server will serve, so a module that does
      # not match its fe.q8 fails here and not in a browser with
      # "the noise filter stopped: fe: fe_init failed" in a corner.
      - name: filter check
        run: node tools/fe-check.mjs
      - name: client
        run: |
          npm ci --prefix client
          # esbuild strips types without checking them, so the type check runs
          # here: a type error that builds is still a broken client.
          npm --prefix client run check
          # The lint set is the one the repo configures, and it was not run by
          # any workflow: an unsafe regex and three dead identifiers sat in the
          # tree while every job was green.
          npm --prefix client run lint
          node client/build.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags "-s -w" -o static/pq.wasm ./cmd/pqwasm
          go run -trimpath -buildvcs=false ./cmd/pack

      # The Go tests and vet, before any artifact is made.
      - name: test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          mkdir -p out
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o out/stanze-${{ matrix.label }} .
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o out/selftest-${{ matrix.label }} ./cmd/selftest
          (cd out && sha256sum * > SHA256SUMS-${{ matrix.label }})

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out
          if-no-files-found: error
          retention-days: 14

  # A release needs every artifact at once, so it cannot live in the matrix:
  # three parallel legs would race to create the same release.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same filter step as the binaries: the browser below hears the module a
      # user would get, not one built by a different clang.
      - name: filter
        env:
          WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          sdk=/opt/wasi-sdk
          if [ ! -x "$sdk/bin/clang" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 900 -o /tmp/sdk.tar.gz "$WASI_SDK_URL"
            echo "$WASI_SDK_SHA256  /tmp/sdk.tar.gz" | sha256sum -c -
            sudo mkdir -p "$sdk"
            sudo tar -xzf /tmp/sdk.tar.gz -C "$sdk" --strip-components=1
            rm -f /tmp/sdk.tar.gz
          fi
          TIER=small CC="$sdk/bin/clang" tools/fewasm/build.sh tools/fewasm/out
          cp tools/fewasm/out/fe.wasm static/fe.wasm
          cp tools/fewasm/engine/weights/fe.q8 static/fe.q8
          rm -rf tools/fewasm/out
          node tools/fe-check.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The browser is playwright's own build, matching the driver, with the
      # libraries it needs. /tmp/pw has no lockfile, so the package goes in
      # with install and not ci.
      - name: browser
        run: |
          npm ci --prefix client
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save playwright-core@1.47.2
          node /tmp/pw/node_modules/playwright-core/cli.js install --with-deps chromium firefox

      # A server, its own port per suite, each suite a step of its own so one
      # failure names itself. Every suite is the browser a person has: the
      # homepage join, the smoke of one room, the mixed engines, and the world.
      - name: build
        run: |
          node client/build.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags "-s -w" -o static/pq.wasm ./cmd/pqwasm
          # the server embeds packed/static.tgz, a build artifact
          go run -trimpath -buildvcs=false ./cmd/pack
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o /tmp/stanze .

      - name: smoke
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 0 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/smoke.js; code=$?; kill $pid || true; exit $code

      - name: join
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 0 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/join-e2e.js; code=$?; kill $pid || true; exit $code

      - name: mixed engines
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 0 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/mixed-browser-e2e.js; code=$?; kill $pid || true; exit $code

      - name: world
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 0 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/wam-e2e.js; code=$?; kill $pid || true; exit $code

      # Four guests in one room: six links, every pair agreed on by both ends,
      # and the mesh still whole after all four mics open.
      - name: quartet
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 0 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/quartet-e2e.js; code=$?; kill $pid || true; exit $code

      # The same four guests with every link told to use the relay. This is the
      # only suite that catches a page which never asked for the relay list, or
      # one that asked before the pair existed: both leave four guests in a call
      # where no candidate pair is ever relayed.
      - name: relay quartet
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 3478 -turn-public-ip 127.0.0.1 \
            -turn-min-port 49200 -turn-max-port 49300 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/relay-quartet-e2e.js; code=$?; kill $pid || true; exit $code

      # A machine with no webcam is not a second-class guest: the pair setup
      # adds a transceiver per kind whether or not there is a device behind it.
      # This step is what keeps that true.
      - name: relay without devices
        env: {PW: /tmp/pw/node_modules/playwright-core, ROOMSBASE: "http://127.0.0.1:8095", OUTDIR: shots}
        run: |
          /tmp/stanze -listen 127.0.0.1:8095 -turn-port 3478 -turn-public-ip 127.0.0.1 \
            -turn-min-port 49200 -turn-max-port 49300 & pid=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8095/ && break; sleep 1; done
          node tools/relay-nodev-e2e.js; code=$?; kill $pid || true; exit $code

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr rejects upper case, and a repository name may carry some.
      - name: name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # A PR builds and pushes nothing; only main and tags get there.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RELEASE_TAG is the version this build advertises. A pushed tag wins;
      # otherwise a manual run carries the constant below, so the published
      # image is always reachable under one fixed name on main too.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      # The builder runs on the runner's own platform and Go cross compiles
      # into the target, so no qemu is needed for the arm64 half.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VOSK_MODEL_URL=${{ vars.VOSK_MODEL_URL }}
            VOSK_MODEL_SHA256=${{ vars.VOSK_MODEL_SHA256 }}
            VOSK_MODEL_LANG=${{ vars.VOSK_MODEL_LANG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # x86-64-v4 is a separate tag, never the default: the binary faults on
      # anything below AVX-512, which is most machines that are not new servers.
      - uses: docker/metadata-action@v5
        if: github.event_name != 'pull_request'
        id: meta-v4
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=-v4
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      - name: build v4
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GOAMD64=v4
            VOSK_MODEL_URL=${{ vars.VOSK_MODEL_URL }}
            VOSK_MODEL_SHA256=${{ vars.VOSK_MODEL_SHA256 }}
            VOSK_MODEL_LANG=${{ vars.VOSK_MODEL_LANG }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-v4.outputs.tags }}
          labels: ${{ steps.meta-v4.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
